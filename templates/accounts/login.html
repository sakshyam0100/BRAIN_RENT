{% extends "base.html" %}
{% load static %}

{% block title %}Login | BRAIN-RENT{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}?v=2">
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="login-container">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</section>

{% endblock %}
