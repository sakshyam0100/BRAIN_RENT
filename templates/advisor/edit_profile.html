{% extends "base.html" %}
{% load static %}

{% block title %}Edit Advisor Profile | BRAIN-RENT{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/edit_advisor_profile.css' %}">
{% endblock %}

{% block content %}

<section class="edit-profile">

    <h1>Edit Advisor Profile</h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <h3>Profile Picture</h3>

        {{ user_form.as_p }}

        <hr>

        <h3>Advisor Information</h3>

        {{ profile_form.as_p }}

        <button type="submit">
            Save Changes
        </button>

        <a href="{% url 'advisor_dashboard' %}">
            <button type="button">
                Cancel
            </button>
        </a>

    </form>

</section>

{% endblock %}
