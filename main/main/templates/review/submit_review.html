{% extends "base.html" %}

{% block title %}Review Advisor | BRAIN-RENT{% endblock %}

{% block content %}

<section>

    <h1>Review Your Advisor</h1>

    <p>
        <strong>Question:</strong>
        {{ question.title }}
    </p>

    <p>
        Please rate your experience with the advisor.
    </p>

    <hr>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Review
        </button>

    </form>

</section>

{% endblock %}
